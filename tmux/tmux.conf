set -g prefix C-q
bind q send-prefix
# 既定の prefix (C-b) の割り当てを外す (docs/adr/0055)
unbind C-b

set-environment -g DOTFILES ~/dotfiles

set -g history-limit 2000000

set -g mouse on

set-option -g status-interval 2

set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"
# 表示中のペインのプログラムが包んで送る制御 (画像の表示など) を、そのまま Ghostty に通す (docs/adr/0054)
set -g allow-passthrough on
# Shift+Enter などの修飾キーの組み合わせを、ペインのプログラムに渡す (docs/adr/0055)
set -s extended-keys on
set -as terminal-features ",*:extkeys"

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!" # XDG の場所 (docs/adr/0042)

set -g pane-border-lines heavy
set -g pane-border-style "fg=#6c99bb"
set -g pane-active-border-style "fg=#e87d3e,bold"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[reverse] #P: #{pane_current_command} #[noreverse],#[fg=colour240] #P: #{pane_current_command} }"
set -g window-style "fg=colour245,bg=colour234"
set -g window-active-style "fg=colour255,bg=colour232"

# enable vi-mode
setw -g mode-keys vi
set -sg escape-time 10 # tmux 3.5 以降の既定。0 だと遅い経路で Esc で始まる入力が分断されることがある (docs/adr/0046)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix + p / n (前・次のウィンドウ) は tmux の既定の割り当てを使う (docs/adr/0046)
# 分割・新規ウィンドウは今のペインのディレクトリで開く (docs/adr/0009)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# enable clipboard
set -s set-clipboard on
# copy-pipe 系でコマンドを省いたときに使う、クリップボードへのコピーのコマンド (docs/adr/0046)
set -s copy-command pbcopy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Enter は set-clipboard on 経由でシステムクリップボードへ伝播
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# tmux-yank の代わり (docs/adr/0029): y とマウスでの選択はクリップボードへ (copy-command)、Y は入力欄へ貼り付け
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "tmux paste-buffer -p"
# prefix + y: シェルの入力行をクリップボードへ。prefix + Y: ペインのカレントディレクトリのパスをクリップボードへ
bind y run-shell -b "$DOTFILES/tmux/scripts/copy-line"
# Ctrl-T (prefix 無し): 全セッションのウィンドウを fzf で選んで切り替える。tmux が先に受け取るので、zsh・nvim のどちらでも効く
# (nvim の Ctrl-T は使えなくなる。docs/adr/0052)
bind -n C-t display-popup -E -w 80% -h 70% "$DOTFILES/tmux/scripts/window-switcher '#{session_name}:#{window_index}'"
# パスは #{q:} でシェル用に引用する ('・# などを含むパスでも壊れない。docs/adr/0046)
bind Y run-shell -b 'printf %s #{q:pane_current_path} | pbcopy; tmux display-message "PWD copied to clipboard!"'

# tmux-sensible で効いていた設定 (docs/adr/0029)
set -g display-time 4000
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# nova の設定 (@nova-*) は nova.tmux を実行する前に読み込む
source-file "$DOTFILES/tmux/statuses.conf"
# tmux-nova は Nix で入れる (flake.nix の xdg.configFile。docs/adr/0029)
run-shell ~/.config/tmux/plugins/tmux-nova/nova.tmux
