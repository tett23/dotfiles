unbind-key -n C-a
set -g prefix C-q
bind q send-prefix

set-environment -g DOTFILES ~/dotfiles

set -g history-limit 2000000

set -g mouse on

set-option -g status-interval 2

set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g pane-border-lines heavy
set -g pane-border-style "fg=#6c99bb"
set -g pane-active-border-style "fg=#e87d3e,bold"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[reverse] #P: #{pane_current_command} #[noreverse],#[fg=colour240] #P: #{pane_current_command} }"
set -g window-style "fg=colour245,bg=colour234"
set -g window-active-style "fg=colour255,bg=colour232"

# enable vi-mode
setw -g mode-keys vi
set -sg escape-time 0
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind p previous-window
bind n next-window
# 分割・新規ウィンドウは今のペインのディレクトリで開く (docs/adr/0009)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# enable clipboard
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Enter は set-clipboard on 経由でシステムクリップボードへ伝播
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# tmux-yank の代わり (docs/adr/0029): y とマウスでの選択は pbcopy でクリップボードへ、Y は入力欄へ貼り付け
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "tmux paste-buffer -p"
# prefix + y: シェルの入力行をクリップボードへ。prefix + Y: ペインのカレントディレクトリのパスをクリップボードへ
bind y run-shell -b "$DOTFILES/tmux/scripts/copy-line"
bind Y run-shell -b "tmux display-message -p '#{pane_current_path}' | tr -d '\\n' | pbcopy; tmux display-message 'PWD copied to clipboard!'"

# tmux-sensible で効いていた設定 (docs/adr/0029)
set -g display-time 4000
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# nova の設定 (@nova-*) は nova.tmux を実行する前に読み込む
source-file "$DOTFILES/tmux/statuses.conf"
# tmux-nova は Nix で入れる (flake.nix の xdg.configFile。docs/adr/0029)
run-shell ~/.config/tmux/plugins/tmux-nova/nova.tmux
