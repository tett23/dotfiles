unbind-key -n C-a
set -g prefix C-q
bind q send-prefix

set-environment -g DOTFILES ~/dotfiles

set -g history-limit 2000000

set -g mouse on

set-option -g status-interval 2

set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g pane-border-lines heavy
set -g pane-border-style "fg=#6c99bb"
set -g pane-active-border-style "fg=#e87d3e,bold"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[reverse] #P: #{pane_current_command} #[noreverse],#[fg=colour240] #P: #{pane_current_command} }"
set -g window-style "fg=colour245,bg=colour234"
set -g window-active-style "fg=colour255,bg=colour232"

# enable vi-mode
setw -g mode-keys vi
set -sg escape-time 0
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind p previous-window
bind n next-window
# 分割・新規ウィンドウは今のペインのディレクトリで開く (docs/adr/0009)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# enable clipboard
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y はシステムクリップボードへコピー (tmux-yank がOS別コマンドを自動選択)
# Enter は set-clipboard on 経由でシステムクリップボードへ伝播
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'o0th/tmux-nova'

source-file "$DOTFILES/tmux/statuses.conf"

run "$DOTFILES/tmux/tpm/tpm"
