background="#2e2e2e"
comments="#797979"
white="#d6d6d6"
yellow="#e5b567"
green="#b4d273"
orange="#e87d3e"
purple="#9e86c8"
pink="#b05279"
blue="#6c99bb"

set -g @nova-rows 0
set -gw window-status-current-style bold

# ペイン枠の色 (nova が pane-border-style を上書きするためこちらで指定)
set -g "@nova-pane-border-style" "$blue"
set -g "@nova-pane-active-border-style" "$orange"
set -g "@nova-status-style-bg" "$background"
set -g "@nova-status-style-fg" "$white"
set -g "@nova-status-style-active-bg" "$green"
set -g "@nova-status-style-active-fg" "$background"
set -g "@nova-message-command-style-bg" "$purple"
set -g "@nova-message-command-style-fg" "$background"
set -g "@nova-message-style-bg" "$purple"
set -g "@nova-message-style-fg" "$background"
set -g "@nova-mode-style-bg" "$purple"
set -g "@nova-mode-style-fg" "$background"

set -g @nova-segment-session-info "#S:#I:#P"
set -g @nova-segment-session-info-colors "$purple $background"
set -g @nova-pane "#I:#P#{?pane_in_mode,${pane_mode},} #{?window_flags,#F,} #(basename $(short-pwd)) #W"
set -g @nova-segments-0-left "session-info session"

set -g @nova-segment-lan-ip "#($DOTFILES/tmux/segments/lan-ip)"
set -g @nova-segment-lan-ip-colors "$purple $background"
set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "$green $background"
set -g @nova-segment-time-local "#($DOTFILES/tmux/segments/time-local)"
set -g @nova-segment-time-local-colors "$yellow $background"
set -g @nova-segment-time-utc "#($DOTFILES/tmux/segments/time-utc)"
set -g @nova-segment-time-utc-colors "$yellow $background"
set -g @nova-segments-0-right "time-local time-utc whoami lan-ip"
