# .github/workflows/actions.lock が workflow と合わないか、記録したコミットが上流で確かめられなくなったら失敗する (docs/adr/0141)。
# github/gh-actions-lock の verify-lockfile.yml を写して直したもの。拡張の版は --pin で固定し、上げるときは本人が書き換える
name: verify-lockfile

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
