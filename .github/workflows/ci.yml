# dotfiles の CI (docs/adr/0014)
# - shell スクリプトの静的解析 (警告以上)
# - zsh のテスト
# - コミット済みの ADR が変更されていないことの検査 (adr-guard。docs/adr/0032)
# - nix-darwin の設定の評価 (ビルドはしない)
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同じブランチ・PR の古い実行は取り消す (docs/adr/0046)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            bin/docker-sh bin/figrm bin/orch bin/rtouch bin/short-pwd \
            bin/sync-deps bin/update-mise bin/update-nix \
            tmux/scripts/lan-ip tmux/scripts/time-local tmux/scripts/time-utc tmux/scripts/copy-line tmux/scripts/window-switcher \
            .githooks/pre-commit install.sh bootstrap.sh

  zsh-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      # zsh/tests/ のテストをすべて実行する (足したテストも漏れない。docs/adr/0046)
      - name: zsh tests
        run: |
          status=0
          for t in zsh/tests/*.test.zsh; do
            echo "::group::$t"
            zsh "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  adr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@v0.1.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  nix-eval:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Determinate Nix の現行の推奨の action。ブランチではなく版で参照する (docs/adr/0046)
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: evaluate nix-darwin configuration
        run: nix eval --raw .#darwinConfigurations.dione.system.drvPath
