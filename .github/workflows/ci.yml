# dotfiles の CI (docs/adr/0014)
# - shell スクリプトの静的解析 (警告以上)
# - zsh のテスト
# - コミット済みの ADR が変更されていないことの検査 (adr-guard。docs/adr/0032)
# - nix-darwin の設定の評価 (ビルドはしない)
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            bin/docker-sh bin/figrm bin/orch bin/rtouch bin/short-pwd \
            bin/sync-deps bin/update-mise bin/update-nix \
            tmux/scripts/lan-ip tmux/scripts/time-local tmux/scripts/time-utc tmux/scripts/copy-line \
            .githooks/pre-commit install.sh bootstrap.sh

  zsh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: git-prompt
        run: zsh zsh/tests/git-prompt.test.zsh
      - name: cached-eval
        run: zsh zsh/tests/cached-eval.test.zsh
      - name: fzf-command-finder
        run: zsh zsh/tests/fzf-command-finder.test.zsh
      - name: gitignore-completion
        run: zsh zsh/tests/gitignore-completion.test.zsh

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@v0.1.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  nix-eval:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: evaluate nix-darwin configuration
        run: nix eval --raw .#darwinConfigurations.dione.system.drvPath
