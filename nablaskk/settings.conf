# NablaSKK input settings: key=value per line.
#   input_style=standard|azik|azik_us|act  extended romaji input (AquaSKK sub-rules)
#   yakumono_ippai=on|off  Egg compatible symbols (z1 → ○ ...)
#   old_kana=on|off   old kana (wi → ゐ, we → ゑ, kwa → くゎ, gwa → ぐゎ)
#   comma=fullwidth   type , as ， (default: 、)
#   period=fullwidth  type . as ． (default: 。)
#   suggest=on        list dictionary entries extending the reading being typed
#   suggest_count=5   how many to list
#   completion_extended=on|off  complete from all dictionaries (off: user dictionary only)
#   annotation=on|off show the selected candidate's dictionary annotation
#   skkserv=on        also query an skkserv, after the local dictionaries
#   skkserv_host=localhost
#   skkserv_port=1178
#   skkserv_encoding=euc-jp | utf-8
input_style=standard
yakumono_ippai=on
old_kana=off
comma=japanese
period=japanese
suggest=on
suggest_count=5
completion_extended=on
annotation=on
skkserv=off
skkserv_host=localhost
skkserv_port=1178
skkserv_encoding=euc-jp
