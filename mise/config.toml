[tools]
# 自作のツール。GitHub のリリースのバイナリを入れる (docs/adr/0031)。
# rust は ~/.cargo/bin を PATH に足し、mise は [tools] の順に PATH を並べるので、
# 手で cargo install した同名のコマンドより優先させるため rust より前 (先頭) に書く
"github:tett23/send-to-kindle" = "latest"
"github:tett23/shorten-path" = "latest"
"github:tett23/adr-guard" = "latest" # コミット済みの ADR の変更を防ぐ (docs/adr/0032)
go = "latest"
node = "latest"
python = "latest"
rust = "latest"
deno = "latest"
bun = "latest"
yarn = "latest"
pnpm = "latest"
shfmt = "latest"
biome = "latest"
# mise の登録簿に無いので npm から入れる。usage-hint の型検査に使う (docs/adr/0062)
"npm:typescript" = "latest"
# 既定の取得先 (aqua) は macOS で Intel 版を選ぶので、GitHub のリリースから Apple Silicon 版を取る
"github:bootandy/dust" = "latest"
ghcup = "latest" # Haskell の ghc・cabal は ghcup で入れる (install.sh・bin/update-mise。docs/adr/0050)
ruby = "latest"
lua = "latest"
